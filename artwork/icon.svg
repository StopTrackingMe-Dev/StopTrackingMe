<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 108 108"
     role="img" aria-labelledby="icon-title icon-description">
  <title id="icon-title">StopTrackingMe · 勿追踪</title>
  <desc id="icon-description">对称的浅色链环与中央薄荷绿橡皮擦组成主体，底部短线和圆点提示擦除痕迹，象征去除分享链接中的追踪参数。</desc>

  <defs>
    <linearGradient id="background-color" x1="0" y1="0" x2="108" y2="108"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#155B57"/>
      <stop offset="1" stop-color="#082F3B"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background; the Android launcher supplies the outer mask. -->
  <g id="background">
    <path fill="url(#background-color)" d="M0 0H108V108H0Z"/>
  </g>

  <!-- Keep the complete mark inside the central 66 dp safe circle. -->
  <g id="foreground">
    <g id="link-eraser" transform="translate(54 53) rotate(-45)">
      <g id="link-loops" fill="none" stroke="#F1FFF8" stroke-width="7.2"
         stroke-linecap="round">
        <path d="M-8-13H-12A13 13 0 0 0-12 13H-8"/>
        <path d="M8-13H12A13 13 0 0 1 12 13H8"/>
      </g>
      <g id="eraser">
        <rect id="eraser-sleeve" x="-11.5" y="-5.5" width="23" height="11"
              rx="3" fill="#A0EDCD"/>
        <path id="eraser-tip" fill="#F1FFF8"
              d="M-8.5-5.5H-3V5.5H-8.5Q-11.5 5.5-11.5 2.5V-2.5Q-11.5-5.5-8.5-5.5Z"/>
        <path d="M-3-4V4" fill="none" stroke="#155B57"
              stroke-width="1.6"/>
      </g>
    </g>
    <!-- Small erase marks keep the action visible beside the symmetric link. -->
    <g id="erase-marks">
      <path d="M58 76H65" fill="none" stroke="#A0EDCD"
            stroke-width="2.7" stroke-linecap="round"/>
      <circle cx="70" cy="76" r="1.4" fill="#A0EDCD"/>
    </g>
  </g>
</svg>
