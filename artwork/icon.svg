<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    StopTrackingMe · 勿追踪 — master icon artwork
    Concept: a protective shield guarding against a surveillance eye,
    crossed out by a prohibition slash ("stop tracking me").
    Source of truth: app/src/main/res/drawable/ic_launcher_*.xml (108dp grid, scaled to 1024).
  -->
  <defs>
    <linearGradient id="bg" x1="113.8" y1="75.9" x2="910.2" y2="966.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D2A49"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
  </defs>

  <!-- Background: full-bleed square, no transparency, no rounded corners
       (platforms apply their own masks) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Shield: privacy protection -->
  <path fill="#B7F4E5"
        d="M512,165.9c82.5,57.9 168.8,82.5 260.7,99.6v211.5c0,173.5 -99.6,308.1 -260.7,381.2c-161.2,-73 -260.7,-207.7 -260.7,-381.2V265.4c92,-17.1 178.3,-41.7 260.7,-99.6Z"/>

  <!-- Eye: tracking / surveillance being watched -->
  <path fill="#111A30"
        d="M331.9,497.8C381.3,414.3 442.8,369.8 512,369.8s130.9,44.6 180.1,128C642.9,581.3 581.3,626.1 512,626.1s-130.9,-44.6 -180.1,-128Z"/>
  <circle cx="512" cy="497.8" r="71.1" fill="#5DE2C4"/>
  <circle cx="512" cy="497.8" r="28.4" fill="#111A30"/>

  <!-- Prohibition slash: white halo + red core -->
  <path d="M289.2,734.8L734.8,289.2" fill="none" stroke="#F2FFFC" stroke-width="123.3" stroke-linecap="round"/>
  <path d="M289.2,734.8L734.8,289.2" fill="none" stroke="#FF5E6D" stroke-width="75.9" stroke-linecap="round"/>
</svg>
