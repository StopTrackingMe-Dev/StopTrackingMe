<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E88E5"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: trust-blue gradient, full bleed (platforms apply their own mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Shield drop shadow -->
  <path d="M512 240 L714 302 Q742 311 742 342 V540 C742 668 664 766 512 822 C360 766 282 668 282 540 V342 Q282 311 310 302 Z"
        transform="translate(10 18)" fill="#031A47" opacity="0.28"/>

  <!-- Shield -->
  <path d="M512 240 L714 302 Q742 311 742 342 V540 C742 668 664 766 512 822 C360 766 282 668 282 540 V342 Q282 311 310 302 Z"
        fill="#FFFFFF"/>

  <!-- Severed chain link: tracking cut away from the URL -->
  <g transform="translate(512 512) rotate(-45)">
    <g fill="none" stroke="#0D47A1" stroke-width="36">
      <rect x="-168" y="-56" width="172" height="112" rx="40"/>
      <rect x="-4" y="-56" width="172" height="112" rx="40"/>
    </g>
    <!-- clean cut through the link -->
    <rect x="-28" y="-120" width="56" height="240" fill="#FFFFFF"/>
  </g>

  <!-- sparkle: freshly cleaned -->
  <path d="M384 328 C387 344 396 353 412 356 C396 359 387 368 384 384 C381 368 372 359 356 356 C372 353 381 344 384 328 Z"
        fill="#64B5F6"/>
</svg>
